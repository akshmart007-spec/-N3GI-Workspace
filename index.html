<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N3GI Notepad</title>
<style>
:root {
  --bg: #f8fafc;
  --sb: #ffffff;
  --ed: #ffffff;
  --ink: #0f172a;
  --ink2: #334155;
  --mut: #64748b;
  --acc: #4f46e5;
  --acc-hover: #4338ca;
  --accf: #ffffff;
  --line: #e2e8f0;
  --line2: #f1f5f9;
  --sel: #eef2ff;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.03);
  --shadow-lg: 0 4px 20px rgba(0,0,0,.06);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #0b0f19;
    --sb: #111827;
    --ed: #0f172a;
    --ink: #f1f5f9;
    --ink2: #cbd5e1;
    --mut: #94a3b8;
    --acc: #818cf8;
    --acc-hover: #a5b4fc;
    --accf: #0b0f19;
    --line: #1e293b;
    --line2: #1e293b;
    --sel: #1e1b4b;
    --shadow: 0 1px 3px rgba(0,0,0,.2);
    --shadow-lg: 0 4px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="light"] {
  --bg: #f8fafc; --sb: #ffffff; --ed: #ffffff; --ink: #0f172a; --ink2: #334155;
  --mut: #64748b; --acc: #4f46e5; --acc-hover: #4338ca; --accf: #ffffff;
  --line: #e2e8f0; --line2: #f1f5f9; --sel: #eef2ff;
}
:root[data-theme="dark"] {
  --bg: #0b0f19; --sb: #111827; --ed: #0f172a; --ink: #f1f5f9; --ink2: #cbd5e1;
  --mut: #94a3b8; --acc: #818cf8; --acc-hover: #a5b4fc; --accf: #0b0f19;
  --line: #1e293b; --line2: #1e293b; --sel: #1e1b4b;
}
:root[data-theme="midnight"] {
  --bg: #020617; --sb: #0f172a; --ed: #0f172a; --ink: #e2e8f0; --ink2: #cbd5e1;
  --mut: #94a3b8; --acc: #38bdf8; --acc-hover: #7dd3fc; --accf: #020617;
  --line: #1e293b; --sel: #0c4a6e;
}
:root[data-theme="forest"] {
  --bg: #0c1912; --sb: #13261c; --ed: #152b20; --ink: #ecfdf5; --ink2: #a7f3d0;
  --mut: #6ee7b7; --acc: #34d399; --acc-hover: #6ee7b7; --accf: #064e3b;
  --line: #1a3a28; --sel: #064e3b;
}
:root[data-theme="sunset"] {
  --bg: #fff7ed; --sb: #ffffff; --ed: #fffbeb; --ink: #431407; --ink2: #9a3412;
  --mut: #c2410c; --acc: #f97316; --acc-hover: #ea580c; --accf: #fff;
  --line: #fed7aa; --sel: #ffedd5;
}
:root[data-theme="rose"] {
  --bg: #fff1f2; --sb: #ffffff; --ed: #fff5f6; --ink: #4c0519; --ink2: #9f1239;
  --mut: #be123c; --acc: #e11d48; --acc-hover: #be123c; --accf: #fff;
  --line: #fecdd3; --sel: #ffe4e6;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--font);
  display: flex;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

button, select, input {
  font: inherit;
  color: var(--ink);
}

/* ========== SIDEBAR ========== */
#sb {
  width: 280px;
  background: var(--sb);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  flex: none;
  z-index: 20;
  transition: transform .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1);
}
/* Desktop: sidebar can be collapsed */
body.sb-collapsed #sb {
  width: 0;
  border-right: none;
  overflow: hidden;
}
body.sb-collapsed #sb .brand,
body.sb-collapsed #sb .sbt,
body.sb-collapsed #sb #list,
body.sb-collapsed #sb .cb {
  opacity: 0;
  pointer-events: none;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 20px 14px;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.logo {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--accf);
  background: linear-gradient(135deg, var(--acc), #7c3aed);
  box-shadow: 0 4px 14px color-mix(in srgb, var(--acc) 40%, transparent);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: -0.03em;
}
.sbt {
  padding: 0 16px 12px;
  display: flex;
  gap: 8px;
}
.sbt input {
  flex: 1;
  min-width: 0;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  transition: border-color .15s, box-shadow .15s;
}
.sbt input:focus {
  outline: none;
  border-color: var(--acc);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 18%, transparent);
}
.nb {
  background: var(--acc);
  color: var(--accf);
  border: 0;
  border-radius: var(--radius-sm);
  padding: 9px 14px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  transition: background .15s, transform .1s;
}
.nb:hover { background: var(--acc-hover); }
.nb:active { transform: scale(.97); }

#list {
  flex: 1;
  overflow: auto;
  padding: 4px 12px 12px;
}
.ni {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 2px;
  transition: background .12s;
}
.ni:hover { background: var(--sel); }
.ni.act {
  background: var(--sel);
  box-shadow: inset 3px 0 0 var(--acc);
}
.ni div { flex: 1; min-width: 0; }
.ni b {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 600;
  font-size: 13.5px;
  color: var(--ink);
}
.ni small {
  color: var(--mut);
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  margin-top: 1px;
}
.ni i {
  font-style: normal;
  opacity: 0;
  cursor: pointer;
  padding: 3px 6px;
  border-radius: 5px;
  font-size: 13px;
  color: var(--mut);
  transition: opacity .15s, background .15s;
}
.ni:hover i, .ni.act i { opacity: .7; }
.ni i:hover { opacity: 1; background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }

.cb {
  border-top: 1px solid var(--line);
  padding: 14px 16px;
  font-size: 12px;
  color: var(--mut);
  font-weight: 500;
}
.cb div {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  align-items: center;
}
.cb input[type=color] {
  width: 32px;
  height: 28px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: none;
  cursor: pointer;
}

/* ========== MAIN ========== */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100%;
}
.hd {
  display: flex;
  gap: 8px;
  padding: 10px 14px;
  align-items: center;
  background: var(--sb);
  border-bottom: 1px solid var(--line);
}
#ttl {
  flex: 1;
  min-width: 80px;
  background: transparent;
  border: 0;
  outline: 0;
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.b {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 7px 11px;
  cursor: pointer;
  white-space: nowrap;
  flex: none;
  transition: all .12s;
  min-width: 34px;
  font-size: 13px;
  color: var(--ink2);
}
.b:hover {
  background: var(--sel);
  border-color: color-mix(in srgb, var(--acc) 40%, var(--line));
  color: var(--ink);
}
.b.on {
  background: var(--acc);
  color: var(--accf);
  border-color: var(--acc);
}
.hd select {
  background: var(--sb);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  flex: none;
  max-width: 120px;
  font-size: 13px;
  cursor: pointer;
}
.hd .sc {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  flex: none;
  max-width: 65%;
}
.hd .sc::-webkit-scrollbar { display: none; }

/* Toolbar */
.tl {
  display: flex;
  gap: 4px;
  padding: 7px 12px;
  overflow-x: auto;
  background: var(--sb);
  border-bottom: 1px solid var(--line);
  align-items: center;
  scrollbar-width: none;
}
.tl::-webkit-scrollbar { display: none; }
.tl .b { padding: 6px 9px; font-size: 13px; }
.tl select {
  background: var(--sb);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 6px 8px;
  flex: none;
  font-size: 13px;
}
.tl input[type=color] {
  width: 30px;
  height: 28px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: none;
  flex: none;
  cursor: pointer;
}
.sp {
  width: 1px;
  height: 18px;
  background: var(--line);
  flex: none;
  margin: 0 4px;
}
#tt { display: none; gap: 4px; }
#tt.show { display: flex; }

/* Editor */
#wrap {
  flex: 1;
  overflow: auto;
  position: relative;
  background: var(--bg);
}
#ed {
  max-width: 820px;
  margin: 24px auto;
  min-height: calc(100% - 48px);
  background: var(--ed);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 36px 40px;
  outline: 0;
  font-size: 15.5px;
  line-height: 1.7;
  word-wrap: break-word;
  box-shadow: var(--shadow);
  color: var(--ink);
  position: relative;
}
.full #ed {
  max-width: none;
  margin: 0;
  border-radius: 0;
  border: 0;
  min-height: 100%;
  box-shadow: none;
}
#ed h1 { font-size: 1.85em; margin: .7em 0 .35em; font-weight: 700; letter-spacing: -0.02em; }
#ed h2 { font-size: 1.4em; margin: .65em 0 .3em; font-weight: 650; }
#ed h3 { font-size: 1.15em; margin: .6em 0 .25em; font-weight: 600; }
#ed blockquote {
  margin: .9em 0;
  padding: 8px 16px;
  border-left: 3px solid var(--acc);
  color: var(--mut);
  background: var(--sel);
  border-radius: 0 8px 8px 0;
}
#ed pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 16px 18px;
  border-radius: 10px;
  overflow-x: auto;
  font: 13px/1.55 "JetBrains Mono", Consolas, Menlo, monospace;
  margin: .9em 0;
}
#ed .k { color: #f472b6; }
#ed .s { color: #7dd3fc; }
#ed .c { color: #94a3b8; font-style: italic; }
#ed .n { color: #a5b4fc; }
#ed table { border-collapse: collapse; width: 100%; margin: .9em 0; }
#ed td, #ed th {
  border: 1px solid var(--line);
  padding: 8px 12px;
  min-width: 60px;
}
#ed th { background: var(--sel); text-align: left; font-weight: 600; }
#ed img {
  max-width: 100%;
  border-radius: 10px;
  margin: .5em 0;
  cursor: grab;
  touch-action: none;
  -webkit-user-drag: none;
  user-select: none;
}
#ed img:active { cursor: grabbing; }
#ed img[data-abs="1"] {
  margin: 0;
  max-width: none;
  z-index: 4;
}
#ed a { color: var(--acc); text-decoration: none; }
#ed a:hover { text-decoration: underline; }
#ed hr { border: 0; border-top: 1px solid var(--line); margin: 1.4em 0; }

/* Lock */
#lock {
  position: absolute;
  inset: 0;
  display: none;
  place-items: center;
  background: var(--bg);
  z-index: 5;
}
#lock.show { display: grid; }
#lock div {
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  font-size: 16px;
  font-weight: 500;
}
#lock input {
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--sb);
  width: 240px;
  font-size: 14px;
}

/* Status bar */
.st {
  display: flex;
  gap: 18px;
  padding: 6px 16px;
  background: var(--sb);
  border-top: 1px solid var(--line);
  color: var(--mut);
  font-size: 12px;
  white-space: nowrap;
  overflow-x: auto;
  font-weight: 500;
}
.dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--success);
  margin-right: 6px;
}
.dot.w { background: var(--warning); }

#ov { display: none; }
#toast {
  position: fixed;
  left: 50%;
  bottom: 60px;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: 24px;
  opacity: 0;
  transition: opacity .25s, transform .25s;
  pointer-events: none;
  z-index: 99;
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
}
#toast.s { opacity: .96; transform: translateX(-50%) translateY(-4px); }

/* Mobile */
@media (max-width: 800px) {
  #sb {
    position: fixed;
    inset: 0 auto 0 0;
    transform: translateX(-100%);
    width: 82%;
    max-width: 300px;
    padding-top: env(safe-area-inset-top, 0px);
    box-shadow: var(--shadow-lg);
  }
  #sb.open { transform: none; }
  #ov.open {
    display: block;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 15;
    backdrop-filter: blur(2px);
  }
  #ed {
    margin: 0;
    border-radius: 0;
    border: 0;
    padding: 20px 18px;
    min-height: 100%;
    box-shadow: none;
  }
}

/* ========== SHEETS ========== */
.xo {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--bg);
  display: none;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.xo.show { display: flex; }
.xo .hd {
  background: var(--sb);
  border-bottom: 1px solid var(--line);
}
.xo select {
  background: var(--sb);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 6px 8px;
  flex: none;
}
.fb {
  display: flex;
  gap: 8px;
  padding: 7px 12px;
  background: var(--sb);
  border-bottom: 1px solid var(--line);
  align-items: center;
  color: var(--mut);
  font-size: 13px;
}
.fb input {
  background: var(--ed);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  color: var(--ink);
  font-size: 13px;
}
#xnm { width: 90px; font-weight: 600; }
#xf { flex: 1; min-width: 0; font-family: "JetBrains Mono", Consolas, monospace; }

#gw {
  flex: 1;
  overflow: auto;
  position: relative;
  background: var(--ed);
}
#gi { position: relative; width: max-content; }
#gt {
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
  font-size: 13px;
  color: var(--ink);
}
#gt td, #gt th {
  height: 26px;
  padding: 0 6px;
  overflow: hidden;
  white-space: nowrap;
  max-width: 0;
  border-right: 1px solid transparent;
  border-bottom: 1px solid transparent;
  scroll-margin: 28px 50px;
}
#gt.g td { border-color: var(--line); }
#gt th {
  background: var(--sb);
  color: var(--mut);
  font-weight: 550;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 2;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  user-select: none;
  cursor: pointer;
  font-size: 12px;
}
#gt th[data-h="c"]::after {
  content: "";
  position: absolute;
  right: 0;
  top: 15%;
  bottom: 15%;
  width: 4px;
  background: transparent;
  border-radius: 2px;
  cursor: col-resize;
  transition: background .15s;
}
#gt th[data-h="c"]:hover::after {
  background: var(--acc);
  opacity: 0.7;
}
#gt th[data-h="r"]::after {
  content: "";
  position: absolute;
  left: 15%;
  right: 15%;
  bottom: 0;
  height: 4px;
  background: transparent;
  border-radius: 2px;
  cursor: row-resize;
  transition: background .15s;
}
#gt th[data-h="r"]:hover::after {
  background: var(--acc);
  opacity: 0.7;
}
#gt th.rh { left: 0; top: auto; z-index: 1; }
#gt th.cn { left: 0; z-index: 3; }
#gt td.sel {
  background-color: color-mix(in srgb, var(--acc) 28%, transparent) !important;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc) 50%, transparent);
}
#gt td.act {
  outline: 2.5px solid var(--acc);
  outline-offset: -2px;
  background-color: color-mix(in srgb, var(--acc) 35%, transparent) !important;
  box-shadow: inset 0 0 0 1px var(--acc);
  z-index: 2;
  position: relative;
}
#ci {
  display: none;
  position: absolute;
  z-index: 6;
  border: 2px solid var(--acc);
  background: var(--ed);
  color: var(--ink);
  padding: 0 5px;
  font: 13px var(--font);
  outline: 0;
  border-radius: 2px;
}

.xb {
  display: flex;
  align-items: center;
  background: var(--sb);
  border-top: 1px solid var(--line);
}
#xs {
  flex: 1;
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
}
.xt {
  padding: 8px 14px;
  cursor: pointer;
  color: var(--mut);
  white-space: nowrap;
  border-right: 1px solid var(--line);
  flex: none;
  font-size: 13px;
  font-weight: 500;
  transition: color .12s, background .12s;
}
.xt:hover { color: var(--ink); background: var(--sel); }
.xt.on {
  background: var(--ed);
  color: var(--ink);
  box-shadow: inset 0 -2px 0 var(--acc);
  font-weight: 600;
}
.xt i { font-style: normal; opacity: .55; margin-left: 5px; }
#xst {
  padding: 0 14px;
  color: var(--mut);
  font-size: 12px;
  white-space: nowrap;
  font-weight: 500;
}

.mb {
  display: flex;
  gap: 2px;
  padding: 3px 10px;
  background: var(--sb);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
}
.mb button {
  background: none;
  border: 0;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink2);
  transition: background .12s, color .12s;
}
.mb button:hover { background: var(--sel); color: var(--ink); }

.xo .tl {
  padding: 5px 10px;
  flex-wrap: wrap;
  max-height: 78px;
  overflow-y: auto;
}
.xo .tl select { max-width: 110px; }
.xo .tl .b { font-size: 12.5px; padding: 5px 8px; }
/* On smaller screens hide the second toolbar row by default and show via a toggle */
@media (max-width: 900px) {
  #xt2 { display: none; }
  #xt2.show-tools { display: flex; }
}

#xm {
  display: none;
  position: fixed;
  z-index: 95;
  background: var(--sb);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 5px;
  min-width: 230px;
  max-height: 80vh;
  overflow: auto;
  box-shadow: var(--shadow-lg);
}
#xm.show { display: block; }
#xm button {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  width: 100%;
  background: none;
  border: 0;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  text-align: left;
  white-space: nowrap;
  font-size: 13px;
  color: var(--ink);
  transition: background .1s;
}
#xm button:hover { background: var(--sel); }
#xm em { font-style: normal; color: var(--mut); font-size: 11.5px; }
#xm hr { border: 0; border-top: 1px solid var(--line); margin: 4px 3px; }

#xc {
  display: none;
  gap: 12px;
  overflow-x: auto;
  padding: 10px;
  background: var(--bg);
  border-top: 1px solid var(--line);
}
#xc.show { display: flex; }
.cc {
  flex: none;
  width: 340px;
  background: var(--sb);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
  position: relative;
  color: var(--ink);
  box-shadow: var(--shadow);
}
.cc b { font-size: 13px; font-weight: 600; }
.cc i {
  position: absolute;
  right: 10px;
  top: 6px;
  cursor: pointer;
  font-style: normal;
  opacity: .5;
  font-size: 14px;
}
.cc i:hover { opacity: 1; }
.cc svg { width: 100%; height: auto; font-size: 10px; display: block; }

#gt td.nt { background-image: linear-gradient(225deg, #e11d48 5px, transparent 5px); }
#gt td.dv { background-image: linear-gradient(315deg, var(--acc) 6px, transparent 6px); }
#gt td.nt.dv {
  background-image: linear-gradient(225deg, #e11d48 5px, transparent 5px),
                    linear-gradient(315deg, var(--acc) 6px, transparent 6px);
}
.xo.pt #gw { cursor: copy; }

/* Modal */
#n3m {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99;
  background: rgba(15, 23, 42, .45);
  place-items: center;
  padding: 16px;
  backdrop-filter: blur(4px);
}
#n3m.show { display: grid; }
#n3b {
  background: var(--sb);
  color: var(--ink);
  padding: 20px;
  border-radius: 14px;
  width: min(94vw, 420px);
  max-height: 88vh;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
#n3b h4 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
#n3b p { margin: 0; color: var(--mut); font-size: 13.5px; }
#n3b pre {
  margin: 0;
  font: 12px/1.55 "JetBrains Mono", Consolas, monospace;
  white-space: pre-wrap;
  background: var(--bg);
  padding: 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
}
#n3b label {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 13px;
  color: var(--mut);
  font-weight: 500;
}
#n3b label:has(input[type=checkbox]) {
  flex-direction: row;
  align-items: center;
  gap: 8px;
}
#n3b input:not([type=checkbox]),
#n3b select,
#n3b textarea {
  background: var(--ed);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 9px 11px;
  color: var(--ink);
  font: inherit;
  width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
#n3b input:focus, #n3b select:focus, #n3b textarea:focus {
  outline: none;
  border-color: var(--acc);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 18%, transparent);
}
#n3b input[type=color] { height: 38px; padding: 2px; }
.n3bt {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 6px;
}
.n3bt .b { min-width: 80px; }
.n3bt .nb { min-width: 80px; }

#qrm{display:none;position:fixed;inset:0;z-index:120;background:rgba(15,23,42,.5);place-items:center;padding:16px;backdrop-filter:blur(4px)}
#qrm.show{display:grid}
#qrb{background:var(--sb);color:var(--ink);padding:20px;border-radius:14px;width:min(94vw,360px);display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#qrc{background:#fff;padding:12px;border-radius:10px;min-width:204px;min-height:204px;display:grid;place-items:center;color:#334155;font-size:13px}
#qrl,#qin,#qtu,#qtn,#qtc{width:100%;background:var(--ed);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:12px}
#ipn{display:none;position:fixed;z-index:130;background:var(--sb);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow-lg);flex-direction:column;gap:6px;font-size:12px;width:min(92vw,290px)}
#ipn.show{display:flex}
#ipn .ir{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
#ipn button{background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--ink2);font-size:12px}
#ipn button:hover{background:var(--sel)}
#ipn input[type=number]{width:64px;background:var(--ed);border:1px solid var(--line);border-radius:6px;padding:3px 5px;color:var(--ink)}
#ipn input[type=range]{flex:1;min-width:80px}
#imf{display:none;position:fixed;z-index:128;border:2px dashed var(--acc);pointer-events:none}
#imh{display:none;position:fixed;z-index:129;width:18px;height:18px;background:var(--acc);border:2px solid #fff;border-radius:50%;cursor:nwse-resize;touch-action:none}
#nfb{display:none;gap:6px;padding:6px 12px;background:var(--sb);border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
#nfb.show{display:flex}
#nfb input[type=text]{background:var(--ed);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:100px;flex:1;max-width:200px;color:var(--ink)}
#nfb label{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:3px}
::highlight(n3a){background:#fde68a;color:#000}
::highlight(n3f){background:#fb923c;color:#000}
#gimg{position:absolute;left:0;top:0;width:0;height:0;z-index:1}
#gimg img{position:absolute;max-width:none;cursor:move;touch-action:none;-webkit-user-drag:none}
.xo.tlc #xt,.xo.tlc #xt2{display:none!important}
#xtg{background:var(--acc)!important;color:#fff!important;font-weight:600;border-color:transparent!important}
#imr{display:none;position:fixed;z-index:129;width:22px;height:22px;background:#fff;color:var(--acc);border:2px solid var(--acc);border-radius:50%;cursor:grab;touch-action:none;box-sizing:border-box;align-items:center;justify-content:center;font-size:13px;line-height:1;user-select:none}
#imr:active{cursor:grabbing}
@media print {
  #sb, .hd, .tl, .st { display: none; }
  body { display: block; overflow: visible; }
  #wrap { overflow: visible; }
  #ed { box-shadow: none; border: 0; margin: 0; }
}

 var o=document.createElement('option');o.value='__sys';o.textContent='💻 System fonts load karein…';sel.appendChild(o)};

 H.addEventListener('pointerdown',function(e){if(!cur)return;e.preventDefault();H.setPointerCapture(e.pointerId);var x0=e.clientX,w0=read(cur).w;

function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)}

/* Robust lock - works with or without crypto.subtle */
function simpleHash(s){

  return 's'+Math.abs(h).toString(36)+s.length;
}
function unlock(){
  var n=cur(), p=$('lp').value;

      pw[n.id]=p; plain[n.id]=h;
      ed.contentEditable='true'; ed.innerHTML=h; $('lock').className=''; hl(); stats(); ed.focus();
    },function(){toast('Wrong password');$('lp').value='';});
    return;
  }
  // Simple fallback path
  if(n.enc.h && n.enc.h === simpleHash(p)){
    pw[n.id]=p;
    ed.contentEditable='true';
    ed.innerHTML = n.enc.data || n.html || '';
    $('lock').className='';

/* Image: free drag (anywhere) + tools only on double-tap/double-click */
(function(){
  var dragImg=null, sx=0, sy=0, ox=0, oy=0, moved=0, lastTap=0, startLeft=0, startTop=0;
  function toAbs(img){
    if(img.dataset.abs==='1') return;
    var r=img.getBoundingClientRect(), er=ed.getBoundingClientRect();
    var bl=parseFloat(getComputedStyle(ed).borderLeftWidth)||0;
    var bt=parseFloat(getComputedStyle(ed).borderTopWidth)||0;
    var left=r.left-er.left-bl;
    var top=r.top-er.top-bt;
    img.style.position='absolute';
    img.style.left=Math.max(0,left)+'px';
    img.style.top=Math.max(0,top)+'px';
    img.style.margin='0';
    img.dataset.abs='1';
  }
  function openTools(img){
    N3IMG.open(img,{align:1,onChange:function(){ed.dispatchEvent(new Event('input',{bubbles:true}))}});
  }
  ed.addEventListener('pointerdown',function(e){
    if(e.target.tagName!=='IMG') return;
    var img=e.target;
    var now=Date.now();
    // double-tap / double-click → open size/rotate/flip tools
    if(now-lastTap<320){
      lastTap=0;
      e.preventDefault();
      openTools(img);
      return;
    }
    lastTap=now;
    e.preventDefault();
    try{img.setPointerCapture(e.pointerId)}catch(x){}
    dragImg=img; moved=0;
    sx=e.clientX; sy=e.clientY;
    var r=img.getBoundingClientRect(), er=ed.getBoundingClientRect();
    var bl=parseFloat(getComputedStyle(ed).borderLeftWidth)||0;
    var bt=parseFloat(getComputedStyle(ed).borderTopWidth)||0;
    startLeft=r.left-er.left-bl;
    startTop=r.top-er.top-bt;
    ox=parseFloat(img.style.left);
    oy=parseFloat(img.style.top);
    if(isNaN(ox)) ox=startLeft;
    if(isNaN(oy)) oy=startTop;
    img.style.cursor='grabbing';
    img.style.zIndex='6';
  });
  ed.addEventListener('pointermove',function(e){
    if(!dragImg) return;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved && Math.abs(dx)+Math.abs(dy)<5) return;
    if(!moved){
      moved=1;
      toAbs(dragImg);
      ox=parseFloat(dragImg.style.left)||startLeft;
      oy=parseFloat(dragImg.style.top)||startTop;
    }
    var nx=Math.max(0, ox+dx), ny=Math.max(0, oy+dy);
    dragImg.style.left=nx+'px';
    dragImg.style.top=ny+'px';
    if(window.N3IMG && typeof N3IMG.refresh==='function') N3IMG.refresh();
  });
  function endDrag(e){
    if(!dragImg) return;
    try{dragImg.releasePointerCapture(e.pointerId)}catch(x){}
    dragImg.style.cursor='grab';
    dragImg.style.zIndex= dragImg.dataset.abs==='1' ? '4' : '';
    if(moved){
      ed.dispatchEvent(new Event('input',{bubbles:true}));
    }
    dragImg=null; moved=0;
  }
  ed.addEventListener('pointerup',endDrag);
  ed.addEventListener('pointercancel',endDrag);
  ed.addEventListener('click',function(e){
    if(e.target.tagName==='IMG') e.preventDefault();
  });
})();

  if(t&&t.dataset.r)return t;
  return null;
}

var touchDrag=false,touchStartCell=null,longPressTimer=null;
gh.addEventListener('touchstart',function(e){
  if(e.touches.length!==1)return;
  var p=e.touches[0],t=cellFromPoint(p.clientX,p.clientY);
  if(!t||!t.dataset.r)return;
  if(ed)commit(0,0);
  var r=+t.dataset.r,c=+t.dataset.c;
  touchStartCell={r:r,c:c};
  touchDrag=false;
  longPressTimer=setTimeout(function(){
    longPressTimer=null;
    showMenu(p.clientX,p.clientY,CELLM);
  },550);
},{passive:true});

gh.addEventListener('touchmove',function(e){
  if(!touchStartCell||e.touches.length!==1)return;
  if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null}
  if(!mR&&!touchDrag){touchStartCell=null;return}
  var p=e.touches[0],t=cellFromPoint(p.clientX,p.clientY);
  if(!t||!t.dataset.r)return;
  var r=+t.dataset.r,c=+t.dataset.c;
  if(!touchDrag){
    // only start range select after moving a bit
    if(r===touchStartCell.r&&c===touchStartCell.c)return;
    touchDrag=true;
    ar=er=touchStartCell.r;ac=ec=touchStartCell.c;
    ex=[];
  }
  if(r!==er||c!==ec){er=r;ec=c;updSel()}
  e.preventDefault();
},{passive:false});

gh.addEventListener('touchend',function(e){
  if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null}

    // single tap = select cell
    ar=er=touchStartCell.r;ac=ec=touchStartCell.c;ex=[];updSel();
  }
  touchStartCell=null;touchDrag=false;
},{passive:true});

function up(){return cls.filter(function(c){return c.connected})}
function pub(obj,qos){if(stopped||!TOPIC)return;var s0=sess;obj.f=ME;
 seal(JSON.stringify(obj)).then(function(s){if(s0!==sess)return;var id=rid(),SZ=30000,n=Math.max(1,Math.ceil(s.length/SZ)),L=up();
  for(var i=0;i<n;i++){var e=JSON.stringify({i:id,n:i,m:n,d:s.slice(i*SZ,(i+1)*SZ)});L.forEach(function(c){try{c.publish(TOPIC,e,{qos:qos||0})}catch(x){}})}},function(){})}
function onRaw(raw){var e;try{e=JSON.parse(raw)}catch(x){return}
 if(!e||!e.i)return;var key=e.i+':'+e.n;if(seenS[key])return;seenS[key]=1;seen.push(key);if(seen.length>800)delete seenS[seen.shift()];
 var a=asm[e.i]||(asm[e.i]={p:[],c:0,t:Date.now()});if(!a.p[e.n]){a.p[e.n]=e.d;a.c++}
 if(a.c<e.m)return;delete asm[e.i];var s0=sess;
 unseal(a.p.join('')).then(function(str){if(s0!==sess)return;handle(JSON.parse(str))},function(){})}

/* ---- note sync logic ---- */
function sig(m){return m.k+'\u0001'+m.title+'\u0001'+m.html}
function snapMsg(k,r){var g=N3N.get(k);return g?{t:'u',r:r?1:0,k:k,title:g.title,html:g.html,ts:r?g.ts:Date.now()}:null}
function sendSnaps(to){N3N.keys().forEach(function(k){var m=snapMsg(k,1);if(m){if(to)m.to=to;pub(m,1)}})}
function flush(){var k=N3N.curKey();if(!k||stopped)return;var m=snapMsg(k,0);if(!m)return;var sg=sig(m);if(lastSig[k]===sg)return;lastSig[k]=sg;pub(m,1)}
window.N3changed=function(){editT=Date.now();if(stopped)return;clearTimeout(tm);tm=setTimeout(flush,150)};
function commit(m){lastSig[m.k]=sig(m);N3N.put(m.k,m.title,m.html,m.ts);lastSync=Date.now();ui()}
function got(m){if(m.t!=='u'||!m.k)return;
 if(m.r){var l=N3N.get(m.k);if(l){if(l.ts>(m.ts||0)){var b=snapMsg(m.k,0);if(b){b.to=m.f;pub(b,1)}return}if(sig({k:l.k,title:l.title,html:l.html})===sig(m))return}}
 var k=m.k;if(N3N.curKey()===k&&Date.now()-editT<400){pend[k]=m;clearTimeout(pendT[k]);pendT[k]=setTimeout(function(){var p=pend[k];delete pend[k];if(p)commit(p)},450);return}
 commit(m)}
/* ---- Sheets live sync (cell-level changes, Excel jaisa) ---- */
function sendX(to){if(!xSynced||!window.N3W)return;pub({t:'xs',to:to,n:N3W.count(),W:N3W.full()},1)}
function gotX(m){if(!window.N3W||!m.W)return;
 if(!xSynced){if(m.n===0&&N3W.count()>0){xSynced=true;N3W.baseline();sendX(m.f);return}
  var had=N3W.count()>0;N3W.setFull(m.W);xSynced=true;lastSync=Date.now();toast(had?'Sheet sync ✓ (purani local sheet backup mein hai)':'Sheet bhi sync ho gayi ✓');ui();return}
 if(N3W.count()===0&&m.n>0){N3W.setFull(m.W);lastSync=Date.now();ui()}}
window.N3Wchanged=function(){if(stopped||!xSynced||!window.N3W)return;clearTimeout(xT);xT=setTimeout(function(){var d=N3W.delta();if(d)pub({t:'xd',d:d},1)},200)};
function handle(m){if(!m||!m.f||m.f===ME)return;if(m.to&&m.to!==ME)return;
 var isNew=!peers[m.f];peers[m.f]=Date.now();
 if(m.t==='bye'){delete peers[m.f];ui();return}
 if(m.t==='hi'){if(Date.now()-(hiAt[m.f]||0)>1200){hiAt[m.f]=Date.now();sendSnaps(m.f);sendX(m.f)}pub({t:'p'},0);ui();return}
 if(m.t==='p'){if(isNew)sendSnaps(m.f);ui();return}
 if(m.t==='u')got(m);else if(m.t==='xs')gotX(m);else if(m.t==='xd'&&xSynced&&window.N3W){N3W.applyDelta(m.d);lastSync=Date.now();ui()}}

/* ---- connection manager: all brokers at once = no single point of failure ---- */
function connect(){var s0=sess;
 needMq().then(function(){if(s0!==sess||stopped)return;
  BROKERS.forEach(function(u){
   var c=mqtt.connect(u,{clientId:'n3gi_'+ME+'_'+rid().slice(0,4),clean:true,keepalive:20,reconnectPeriod:1500,connectTimeout:8000,resubscribe:true});
   c.on('connect',function(){if(s0!==sess)return;c.subscribe(TOPIC,{qos:1},function(){if(s0!==sess)return;pub({t:'hi'},1);ui()});ui()});
   c.on('message',function(t,p){if(s0!==sess)return;try{onRaw(new TextDecoder().decode(p))}catch(e){}});
   c.on('close',ui);c.on('offline',ui);c.on('error',ui);
   cls.push(c)})},
 function(){toast('Connection library load nahi hui — internet check karein');ui()})}
setInterval(function(){if(stopped)return;pub({t:'p'},0);if(guest&&!xSynced&&alive())pub({t:'hi'},1);var t=Date.now();
 for(var k in peers)if(t-peers[k]>15000)delete peers[k];
 for(var j in asm)if(t-asm[j].t>60000)delete asm[j];
 saveS();ui()},4000);
function health(){if(stopped)return;cls.forEach(function(c){if(!c.connected&&!c.reconnecting){try{c.reconnect()}catch(e){}}});setTimeout(function(){if(!stopped&&up().length)pub({t:'hi'},1)},800)}
document.addEventListener('visibilitychange',function(){if(!document.hidden)health()});
window.addEventListener('online',health);

function saveS(){try{localStorage.setItem(SK,JSON.stringify({code:CODE,ts:Date.now()}))}catch(e){}}
function start(code,quiet,resume){
 if(!code&&!N3N.mark())return toast('Locked note share nahi ho sakta — pehle unlock karein');
 stop(true);sess++;stopped=false;guest=!!code;wasLive=false;CODE=code||genCode();xSynced=!code||!!resume;if(xSynced&&window.N3W)N3W.baseline();var s0=sess;
 saveS();ui();if(!quiet){modal().classList.add('show');showActive()}
 setup(CODE).then(function(){if(s0!==sess)return;connect();ui()},function(){toast('Encryption setup fail — https/Chrome use karein');stop(true)})}
function stop(quiet){var old=cls,tp=TOPIC;
 if(!stopped&&old.length&&TOPIC){seal(JSON.stringify({t:'bye',f:ME})).then(function(s){var e=JSON.stringify({i:rid(),n:0,m:1,d:s});old.forEach(function(c){try{if(c.connected)c.publish(tp,e,{qos:0})}catch(x){}})}).catch(function(){}).then(function(){setTimeout(function(){old.forEach(function(c){try{c.end(true)}catch(x){}})},500)})}
 else old.forEach(function(c){try{c.end(true)}catch(x){}});
 sess++;stopped=true;cls=[];peers={};hiAt={};asm={};seen=[];seenS={};CODE='';TOPIC='';KEY=null;guest=false;wasLive=false;xSynced=false;
 try{localStorage.removeItem(SK)}catch(e){}stopScan();ui();
 if(!quiet){var m=$('qrm');if(m)m.classList.remove('show');toast('Live connection band')}}

/* ---- UI ---- */
function alive(){var n=0,t=Date.now();for(var k in peers)if(t-peers[k]<15000)n++;return n}
function state(){if(stopped)return'idle';if(!up().length)return'connecting';return alive()?'live':'waiting'}
function ui(){var s=state(),n=alive();
 $('syncBtn').textContent={idle:'📱 Connect',waiting:'🟡 Waiting…',connecting:'🟡 Connecting…',live:'🟢 Live ('+n+')'}[s];
 if(s==='live'&&!wasLive){wasLive=true;toast('Connected — live sync ON ✓');if(guest){var mm=$('qrm');if(mm)mm.classList.remove('show')}}
 if(s!=='live')wasLive=false;
 if(!$('qrs'))return;var idle=stopped,sc=$('scanbox').style.display==='block';
 $('qa').style.display=(idle&&!sc)?'flex':'none';$('qh').style.display=idle?'none':'flex';
 $('qadd').style.display=(!idle&&N3N.curKey()===null)?'':'none';
 $('qst').textContent={idle:'',waiting:'🟡 Dusre device ka wait… QR scan karao ya code daalo',connecting:'🟡 Server se connect ho raha hai…',live:'🟢 Live — '+n+' device connected · real-time sync ON'}[s];
 var st=idle?'':'Server: '+up().length+'/'+BROKERS.length+' online';if(lastSync&&!idle)st+='\nLast update: '+new Date(lastSync).toLocaleTimeString();
 if(!idle&&!SUB)st+='\n⚠ Encryption ke liye https page chahiye (abhi plain mode).';
 if(location.protocol==='file:')st+='\n⚠ File local hai: QR link dusre device par tabhi khulega jab app hosted ho. Code ya "Scan QR" button hamesha chalta hai.';
 $('qrs').textContent=st}
function draw(){var b=$('qrc');b.innerHTML='';if(!CODE)return;needQR().then(function(){new QRCode(b,{text:link(),width:180,height:180,correctLevel:QRCode.CorrectLevel.M})},function(){b.textContent='QR load nahi hua — code use karein'})}
function showActive(){$('qrl').value=link();$('qcode').textContent=fmt(CODE);draw();ui()}

/* ---- in-app QR scanner (camera) ---- */
function stopScan(){scanOn=false;if(stream){try{stream.getTracks().forEach(function(t){t.stop()})}catch(e){}stream=null}var b=$('scanbox');if(b)b.style.display='none'}
function scan(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return toast('Is browser mein camera scan nahi chalega — code daalo');
 navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}).then(function(s){
  stream=s;var v=$('qvid');v.srcObject=s;v.setAttribute('playsinline','');v.muted=true;v.play();scanOn=true;$('scanbox').style.display='block';ui();
  var det=null;try{if(window.BarcodeDetector)det=new BarcodeDetector({formats:['qr_code']})}catch(e){det=null}
  var cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  (det?Promise.resolve():lib(JSQ)).then(tick,function(){stopScan();ui();toast('Scanner load nahi hua — code daalo')});
  function tick(){if(!scanOn)return;
   if(v.readyState>=2&&v.videoWidth){var p;
    if(det)p=det.detect(v).then(function(r){return r[0]&&r[0].rawValue});
    else{var w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);var d=cx.getImageData(0,0,w,h),q=window.jsQR&&jsQR(d.data,w,h);p=Promise.resolve(q&&q.data)}
    p.then(function(txt){if(!scanOn)return;var c=parse(txt);if(c){stopScan();toast('QR mil gaya ✓ — connect ho raha hai');start(c,true);var m=$('qrm');if(m)m.classList.add('show');showActive()}else setTimeout(tick,200)},function(){setTimeout(tick,250)})}
   else setTimeout(tick,150)}
 },function(){toast('Camera permission nahi mili — code daalo')})}

function modal(){var m=$('qrm');if(m)return m;m=document.createElement('div');m.id='qrm';
 m.innerHTML='<div id="qrb">'
 +'<h4 style="margin:0;font-size:17px;font-weight:700">📱 Connect Devices</h4>'
 +'<div style="font-size:12px;color:var(--mut)">QR scan karo ya code daalo — turant live sync</div>'
 +'<div id="qst" style="font-size:14px;font-weight:600"></div>'
 +'<div id="qa" style="display:flex;flex-direction:column;gap:8px;width:100%">'
 +'<button class="nb" id="qsh" style="padding:12px">⚡ Start — QR / Code dikhao</button>'
 +'<button class="b" id="qscan" style="padding:11px">📷 Scan QR (camera)</button>'
 +'<div style="color:var(--mut);font-size:12px;text-align:center">— ya code daalo —</div>'
 +'<input id="qin" placeholder="8-character code (e.g. K7M2-9QXA)" autocomplete="off" autocapitalize="characters">'
 +'<button class="b" id="qjn">🔗 Join with code</button></div>'
 +'<div id="qh" style="display:none;flex-direction:column;gap:8px;width:100%;align-items:center">'
 +'<div id="qrc"></div>'
 +'<div id="qcode" style="font:700 26px/1 ui-monospace,Consolas,monospace;letter-spacing:.12em"></div>'
 +'<input id="qrl" readonly style="font-size:11px;text-align:center">'
 +'<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'
 +'<button class="b" id="qcc">Copy code</button><button class="b" id="qrcp">Copy link</button><button class="b" id="qadd">➕ Ye note share karo</button><button class="b" id="qrst">Stop</button></div></div>'
 +'<div id="scanbox" style="display:none;width:100%"><video id="qvid" playsinline muted style="width:100%;border-radius:10px;background:#000"></video>'
 +'<div style="font-size:12px;color:var(--mut);margin:6px 0">QR ko camera ke saamne rakho…</div><button class="b" id="qscx">Cancel</button></div>'
 +'<div id="qrs" style="font-size:12px;color:var(--mut);white-space:pre-line"></div>'
 +'<button class="b" id="qrx">Close</button></div>';
 document.body.appendChild(m);
 function cp(v,msg){if(navigator.clipboard)navigator.clipboard.writeText(v).then(function(){toast(msg)},function(){toast(v)});else toast(v)}
 $('qrx').onclick=function(){m.classList.remove('show');stopScan();ui()};
 m.onclick=function(e){if(e.target===m){m.classList.remove('show');stopScan();ui()}};
 $('qsh').onclick=function(){start()};
 $('qjn').onclick=function(){var c=parse($('qin').value);if(!c)return toast('Code 8 characters ka hona chahiye');start(c)};
 $('qin').onkeydown=function(e){if(e.key==='Enter')$('qjn').click()};
 $('qscan').onclick=scan;$('qscx').onclick=function(){stopScan();ui()};
 $('qcc').onclick=function(){cp(CODE,'Code copied')};$('qrcp').onclick=function(){cp(link(),'Link copied')};
 $('qrst').onclick=function(){stop(false)};
 $('qadd').onclick=function(){var k=N3N.mark();if(!k)return toast('Locked note share nahi ho sakta');var x=snapMsg(k,0);lastSig[k]=sig(x);pub(x,1);toast('Note share ho gaya ✓');ui()};
 return m}
$('syncBtn').onclick=function(){var m=modal();m.classList.add('show');if(!stopped)showActive();else ui()};

/* ---- open via QR link (#join=CODE) or resume after refresh ---- */
function hashJoin(){var m=location.hash.match(/[#&]join=([A-Za-z0-9-]+)/);if(!m)return false;
 var c=parse(m[1]);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
 if(c){start(c,true);toast('Connect ho raha hai…')}else toast('Invalid link');return true}
window.addEventListener('hashchange',hashJoin);
setTimeout(function(){if(hashJoin())return;
 try{var sv=JSON.parse(localStorage.getItem(SK)||'null');if(sv&&sv.code&&Date.now()-sv.ts<432e5)start(sv.code,true,true)}catch(e){}
},300);
ui();
})();
</script>
